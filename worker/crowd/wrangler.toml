# שרת השתתפות הגולשים ("ההשערה שלי" + דשבורד). נפרס מ-.github/workflows/crowd-worker.yml
# סודות (wrangler secret put): IP_KEY — נוצר אוטומטית בפריסה; רשות: IP_KEY_PREV. אין מייל.
name = "elections26-crowd"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# מזהה הלקוח של Google (גלוי, לא סוד) — לאימות כניסה עם Google
GOOGLE_CLIENT_ID = "842977993302-8n4sibbf7rgr6e1ludvi28oojua9ht9t.apps.googleusercontent.com"
# מפתח ה-Web של פרויקט Firebase לאימות מייל. גלוי לפי Firebase (לא סוד); מומלץ להגביל אותו ב-Google Cloud ל-Identity Toolkit API
FIREBASE_API_KEY = "AIzaSyCpQqdBDjlh9zWEDBwnDhBK93wLONlvXzs"
ALLOWED_ORIGIN = "https://hopetohelp.github.io"
SITE_URL = "https://hopetohelp.github.io/26/"

[[d1_databases]]
binding = "DB"
database_name = "elections26-crowd"
database_id = "a0564cb0-3bea-40e9-b5a9-e0dae54b6a86"

# צבירה, זיהוי חריגות וניקוי — כל שעה
[triggers]
crons = ["0 * * * *"]

# כל שיחות התמיכה נשמרות בשרת ההערות; נתיבי התמיכה הישנים מעבירים אליו בלבד.
[[services]]
binding = "FEEDBACK"
service = "elections26-feedback"
