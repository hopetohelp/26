<!doctype html>
<html lang="he" dir="rtl" data-theme="league">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ניתוח הבחירות לכנסת ה-26: הסקרים, התרחישים, תוצאות אמת ומחשבון מנדטים לפי חוק הבחירות." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>בחירות 2026 — ניתוח</title>
    <!-- גופנים מאוחסנים באתר (הכרעת בעלים 9.10.2026): הגדרות @font-face ב-src/index.css, קבצים ב-src/assets/fonts. Rubik לעברית, וספרות בלבד ב-Roboto Mono (ברוחב קבוע, ספרות מיושרות). קובץ הספרות קטן (4KB) ולכן משובץ ב-CSS ואינו נטען מראש. -->
    <link rel="preload" href="/src/assets/fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // העיצוב שהגולש בחר — לפני הציור הראשון, כדי שלא יהבהב העיצוב הלא נכון (src/lib/theme.ts)
      try {
        var t = localStorage.getItem("elections26.theme");
        if (t === "board" || t === "league") document.documentElement.dataset.theme = t;
        var m = localStorage.getItem("elections26.mode") || "auto";
        if (m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.dark = "";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
