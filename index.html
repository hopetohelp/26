<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="בחירות 2026: הסקרים, התרחישים, תוצאות אמת ומחשבון מנדטים לפי חוק הבחירות." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- התקנה כאפליקציה במסך הבית (public/manifest.webmanifest, src/components/InstallApp.tsx) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="בחירות 2026" />
    <title>בחירות 2026</title>
    <!-- גופנים מאוחסנים באתר (הכרעת בעלים 9.10.2026): הגדרות @font-face ב-src/index.css, קבצים ב-src/assets/fonts. Rubik לעברית, וספרות בלבד ב-Roboto Mono (ברוחב קבוע, ספרות מיושרות). קובץ הספרות קטן (4KB) ולכן משובץ ב-CSS ואינו נטען מראש. -->
    <link rel="preload" href="/src/assets/fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // התצורה שהגולש בחר (יום / לילה / לפי המכשיר) — לפני הציור הראשון, כדי שלא יהבהב (src/lib/theme.ts)
      var q = new URLSearchParams(location.hash.split("?")[1] || "");
      var t = q.get("embed") === "1" ? q.get("theme") : null;
      var m = "auto";
      try { m = localStorage.getItem("elections26.mode") || "auto"; } catch (e) {}
      if (m !== "light" && m !== "dark") m = "auto";
      if (q.get("embed") === "1" && t !== "auto") m = t === "dark" ? "dark" : "light";
      if (m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.dark = "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
