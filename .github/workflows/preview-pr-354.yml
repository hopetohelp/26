name: בדיקת אתר מלא ל־PR 354
on:
  push:
    branches: [codex/private-domain-links-2026-10-13]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python3 pipeline/build_data.py
      - name: בניית האתר המלא
        run: npm run build && npx vite-node scripts/check-open-data.ts
        env:
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
          VITE_MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
          MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
      - name: פרסום לענף תצוגה בלבד
        run: npx --yes wrangler@4 pages deploy dist --project-name elections26 --branch preview-pr-354
      - name: בדיקת טעינת האתר והקבצים דרך GitHub Actions
        run: |
          set -euo pipefail
          site=https://preview-pr-354.elections26.pages.dev/
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 "$site" -o /tmp/preview.html && grep -q '<div id="root"></div>' /tmp/preview.html; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 10
          done
          node -e 'const fs=require("fs"); const h=fs.readFileSync("/tmp/preview.html","utf8"); const js=h.match(/src="\.\/(assets\/[^\"]+\.js)"/); const css=h.match(/href="\.\/(assets\/[^\"]+\.css)"/); if (!js||!css) process.exit(1); fs.writeFileSync("/tmp/preview-files", `${js[1]}\n${css[1]}\n`)' 
          while IFS= read -r path; do curl --fail --silent --show-error --location "$site$path" -o /dev/null; done < /tmp/preview-files
          curl --fail --silent --show-error --location "${site}data/index.json" -o /tmp/preview-index.json
          node -e 'const d=require("/tmp/preview-index.json"); if (!Array.isArray(d.files)||d.files.length<10) process.exit(1)'
          curl --fail --silent --show-error --location "${site}llms.txt" -o /dev/null
          echo "תצוגה מקדימה מלאה תקינה: $site"
