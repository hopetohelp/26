name: בדיקות
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: הנתונים נבנים מחדש זהה מחומר הגלם (דטרמיניזם)
        run: |
          AS_OF=$(python3 -c "import json;print(json.load(open('src/data/meta.json'))['dataAsOf'])")
          BUILD_TIME="$AS_OF" python3 pipeline/build_data.py
          git diff --exit-code -- src/data
      - name: המודל — מנוע מהיר זהה למנוע המחקרי, בדיקת עבר עדכנית
        run: python3 pipeline/test_model.py
      - name: מודל החיזוי — מדדים, מגמה, ושלמות יומן ההרצות
        run: python3 pipeline/test_forecast.py
      - name: בדיקות חלופת התחזית המחקרית
        run: python3 pipeline/test_forecast_challenger.py
      - name: סקרים ישירים — קליטה ללא השהיה
        run: python3 pipeline/test_direct_polls.py
      - name: טיפוסים
        run: npx tsc --noEmit -p tsconfig.json
      - name: בדיקות המנוע
        run: npm test
      - name: בנייה
        run: npm run build
      - name: שני השרתים נטענים כמו בפריסה (Node וחבילת Cloudflare, בלי העלאה)
        run: |
          for f in worker/crowd/lib/*.js; do node --input-type=module -e "await import('./$f')"; done
          for w in crowd feedback; do (cd worker/$w && npx --yes wrangler@3 deploy --dry-run --outdir "$RUNNER_TEMP/wr-$w"); done
