# תהליך זמני לתצוגה מקדימה של PR 766 בלבד (CLAUDE.md, "בדיקה בתצוגה מקדימה לפני מיזוג"). יוסר לפני המיזוג.
name: preview-pr-766
on:
  push:
    branches: [claude/data-polls-past]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: מחיקת פריסות התצוגה של preview-pr-766 (סיום הבדיקה)
        run: |
          npx --yes wrangler@4 pages deployment list --project-name elections26 --environment preview --json > /tmp/d.json
          for id in $(node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/d.json","utf8"));for(const x of d){const b=x.Branch||x.branch||(x.deployment_trigger&&x.deployment_trigger.metadata&&x.deployment_trigger.metadata.branch);if(b==="preview-pr-766")console.log(x.Id||x.id)}'); do
            echo "deleting $id"; npx --yes wrangler@4 pages deployment delete "$id" --project-name elections26 --force
          done
