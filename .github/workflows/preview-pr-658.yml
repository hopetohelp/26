# תהליך זמני — תצוגה מקדימה של PR 658 בלבד (CLAUDE.md, "בדיקה בתצוגה מקדימה לפני מיזוג"). יוסר לפני המיזוג.
name: תצוגה מקדימה PR 658
on:
  push:
    branches: [claude/redesign-choice-analysis-tabs-1ksvw0]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: בניית הנתונים
        run: python3 pipeline/build_data.py
      - run: npm run build
        env:
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
          VITE_MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
          MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
      - name: dist תקין
        run: test -f dist/index.html
      - name: פרסום לענף תצוגה preview-pr-658
        run: npx --yes wrangler@4 pages deploy dist --project-name elections26 --branch preview-pr-658
