name: שרת הפידבק
on:
  push:
    branches: [main]
    paths: ["worker/feedback/**", ".github/workflows/feedback-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - name: עדכון מבנה המאגר בתוספת בלבד
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: npx --yes wrangler@3 d1 execute elections26-feedback --remote --file=schema.sql
      - name: פריסה ל-Cloudflare (רק כשהמפתח הוגדר בסודות הריפו)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: npx --yes wrangler@3 deploy
      - name: סוד גיבוב כתובות הרשת — נוצר פעם אחת, רק אם חסר (אישור בעלים 9.10.2026)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: |
          existing="$(npx --yes wrangler@3 secret list 2>/dev/null || echo '[]')"
          if echo "$existing" | grep -q '"IP_KEY"'; then
            echo "IP_KEY קיים"
          else
            openssl rand -base64 32 | npx --yes wrangler@3 secret put IP_KEY
            echo "IP_KEY נוצר"
          fi
      - name: אין מפתח — מדלגים
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN לא הוגדר בסודות הריפו; השרת לא נפרס."
