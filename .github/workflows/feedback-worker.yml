name: שרת הפידבק
on:
  push:
    branches: [main]
    paths: ["worker/feedback/**", "worker/shared/**", ".github/workflows/feedback-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: עדכון מבנה המאגר בתוספת בלבד
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: npx --yes wrangler@3 d1 execute elections26-feedback --remote --file=schema.sql
      - name: פריסה ל-Cloudflare (רק כשהמפתח הוגדר בסודות הריפו)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: npx --yes wrangler@3 deploy
      - name: סוד גיבוב כתובות הרשת — נוצר פעם אחת, רק אם חסר (אישור בעלים 9.10.2026)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/feedback
        run: |
          existing="$(npx --yes wrangler@3 secret list 2>/dev/null || echo '[]')"
          if echo "$existing" | grep -q '"IP_KEY"'; then
            echo "IP_KEY קיים"
          else
            openssl rand -base64 32 | npx --yes wrangler@3 secret put IP_KEY
            echo "IP_KEY נוצר"
          fi
      - name: מפתח AI לתשובות — רק אם הוגדר בסודות הריפו (הכרעת בעלים 12.10.2026)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.AI_API_KEY != ''
        working-directory: worker/feedback
        run: printf '%s' "$AI_API_KEY" | npx --yes wrangler@3 secret put AI_API_KEY
      - name: בדיקת המונים הציבוריים אחרי הפריסה
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://elections26-feedback.hopetohelp-il.workers.dev/usage -o /tmp/public-usage.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/public-usage.json","utf8")); if(!Number.isSafeInteger(d.totalVisitors)||d.totalVisitors<0||!Number.isSafeInteger(d.totalVisits)||d.totalVisits<0||!Number.isFinite(Date.parse(d.publishedAt))||Object.keys(d).sort().join(",")!=="publishedAt,totalVisitors,totalVisits")process.exit(1);console.log("מוני השימוש הציבוריים זמינים וללא שדות אישיים")'
      - name: אין מפתח — מדלגים
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN לא הוגדר בסודות הריפו; השרת לא נפרס."
