# תהליך זמני: מחיקת כל פריסות התצוגה המקדימה (preview-pr-*) בפרויקט elections26 (הכרעת בעלים 04.11.2026) — יוסר לפני המיזוג
name: מחיקת פריסות תצוגה זמנית
on:
  push:
    branches: [claude/coordinator-continued]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - name: מחיקת הפריסות
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/elections26/deployments"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ids=""
          for page in $(seq 1 40); do
            r=$(curl -fsS -H "$H" "$API?env=preview&per_page=25&page=$page")
            n=$(echo "$r" | jq '.result | length')
            [ "$n" = 0 ] && break
            ids="$ids $(echo "$r" | jq -r '.result[] | select(.deployment_trigger.metadata.branch | startswith("preview-pr-")) | "\(.id):\(.deployment_trigger.metadata.branch)"')"
          done
          echo "נמצאו: $(echo $ids | wc -w)"
          for x in $ids; do
            id=${x%%:*}; br=${x#*:}
            ok=$(curl -sS -X DELETE -H "$H" "$API/$id?force=true" | jq -r '.success')
            echo "$br $id ⇐ $ok"
          done
          left=0
          for page in $(seq 1 40); do
            r=$(curl -fsS -H "$H" "$API?env=preview&per_page=25&page=$page")
            n=$(echo "$r" | jq '.result | length'); [ "$n" = 0 ] && break
            left=$((left + $(echo "$r" | jq '[.result[] | select(.deployment_trigger.metadata.branch | startswith("preview-pr-"))] | length')))
          done
          echo "נותרו: $left"
