name: בדיקת מצב פשוט זמנית
on:
  push:
    branches: [feat/focused-view]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: סקרים חדשים מוויקיפדיה — נכנסים אוטומטית, בלי אימות ובלי המתנה
        run: |
          set -uo pipefail
          T="Opinion_polling_for_the_2026_Israeli_legislative_election"
          if curl --fail --silent --show-error --retry 3 --max-time 60 -A "elections26-poll-aggregator (https://github.com/hopetohelp/26)" "https://en.wikipedia.org/w/index.php?title=${T}&action=raw" -o /tmp/polls.wiki \
             && [ "$(wc -c < /tmp/polls.wiki)" -gt 100000 ] && grep -q '^{|' /tmp/polls.wiki; then
            cp /tmp/polls.wiki "raw/wikipedia/en__${T}.wiki"
            echo "טבלת הסקרים עודכנה מוויקיפדיה"
          else
            echo "::warning::הורדת ויקיפדיה נכשלה או חלקית — נשארת הגרסה שבריפו"
          fi
      - name: בניית הנתונים לרגע הפרסום
        run: python3 pipeline/build_data.py
      - run: npm test
        env:
          AUTO_INGEST: "1"
      - run: npm run build
        env:
          # כפתור "הערה?" — השרת הקטן ב-worker/feedback (Cloudflare). בלי המשתנה הכפתור אינו מוצג.
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
          # שרת ה-MCP (worker/mcp): מסך "חיבור עוזר AI", מגירת "עוזרי AI", ושתי הכתובות ב-llms.txt וב-data/index.json
          VITE_MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
          MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
      - name: עותק הסטטיסטיקות בתוך האתר — מוצג לכולם גם בלי חיבור לשרת ההשתתפות
        run: |
          set -uo pipefail
          valid() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (typeof d.participants !== "number") process.exit(1)' "$1"; }
          if curl --fail --silent --show-error --retry 3 --max-time 30 https://elections26-crowd.hopetohelp-il.workers.dev/dashboard -o /tmp/dashboard.json && valid /tmp/dashboard.json; then
            echo "עותק חדש מהשרת"
          elif curl --fail --silent --show-error --retry 2 --max-time 30 https://26.hopetohelp.net/dashboard.json -o /tmp/dashboard.json && valid /tmp/dashboard.json; then
            echo "::warning::השרת לא ענה — נשאר העותק הקודם שבאתר"
          else
            echo "::warning::אין עותק סטטיסטיקות — המסך ינסה את השרת בלבד"
            exit 0
          fi
          cp /tmp/dashboard.json dist/dashboard.json
      - name: עותק ציבורי של מוני המשתמשים והכניסות
        run: |
          mkdir -p dist/data
          if curl --fail --silent --show-error --retry 2 --max-time 15 https://elections26-feedback.hopetohelp-il.workers.dev/usage -o /tmp/usage.json && node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/usage.json","utf8")); if(!Number.isSafeInteger(d.totalUsers)||d.totalUsers<0||!Number.isSafeInteger(d.totalVisitors)||d.totalVisitors<0||!Number.isFinite(Date.parse(d.publishedAt)))process.exit(1)'; then
            cp /tmp/usage.json dist/data/usage.json
          else
            echo "::warning::מוני השימוש לא זמינים לפרסום; הבית ינסה את המקור החי, ללא הצגת אפס מדומה"
          fi
      - name: הנתונים הפתוחים — dashboard.json נעטף ב-about, וכל קובץ שבאינדקס קיים ועדכני
        run: |
          set -euo pipefail
          npx vite-node scripts/open-data.ts --dashboard
          if [ -f dist/dashboard.json ]; then npx vite-node scripts/check-open-data.ts --with-dashboard; else npx vite-node scripts/check-open-data.ts; fi
      - name: בדיקות דפדפן
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ && break || sleep 2; done
          node scripts/check-minimal-mode.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-check
          path: minimal-check
      - name: פרסום תצוגה מקדימה בלבד
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
        run: npx --yes wrangler@4 pages deploy dist --project-name elections26 --branch preview-pr-413
