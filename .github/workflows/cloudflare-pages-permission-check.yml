name: בדיקת הרשאת פרסום ל־Cloudflare Pages

on:
  push:
    branches: [codex/parallel-domain-2026-10-13]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: בדיקת קיום הסוד בלי לחשוף אותו
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN אינו זמין בתהליך הזה"
            exit 1
          fi
      - name: פרסום דף בדיקה לתצוגה מקדימה בלבד
        run: npx --yes wrangler@4 pages deploy .github/pages-permission-check --project-name elections26 --branch codex-token-check
