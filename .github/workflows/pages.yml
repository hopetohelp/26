name: פרסום
on:
  push:
    branches: [main]
  schedule:
    # כל ערב ב-21:30 שעון ישראל (קיץ) — רענון הנתונים והבנייה
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: בניית הנתונים לרגע הפרסום (כלל ההקפאה)
        run: python3 pipeline/build_data.py
      - run: npm test
      - run: npm run build
        env:
          # כפתור "הערה?" — השרת הקטן ב-worker/feedback (Cloudflare). בלי המשתנה הכפתור אינו מוצג.
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: אמת שהאתר החי נגיש ומכיל את הבנייה הנוכחית
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "$PAGE_URL" -o /tmp/live.html; then
              grep -q '<div id="root"></div>' /tmp/live.html
              echo "האתר החי נגיש: $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "האתר החי לא עבר בדיקת smoke לאחר הפרסום" >&2
          exit 1
