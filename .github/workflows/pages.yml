name: פרסום
on:
  push:
    branches: [main]
  schedule:
    # באותה שעה כמו הסשן המרוכז (הכרעת בעלים 12.10.2026): 02, 06, 10, 14, 18 ו-22 שעון ישראל, בדקה 3 — לוח אחד ב-`src/lib/runSchedule.ts`.
    # GitHub מתזמן ב-UTC בלבד, ולכן רשומות שתי עונות השעון (קיץ UTC+3, חורף UTC+2); ה-gate מדלג על כל מה שאינו שעת ריצה בישראל.
    - cron: "3 23,3,7,11,15,19 * * *"
    - cron: "3 0,4,8,12,16,20 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # שבת מושבתת (הכרעת בעלים 12.10.2026): ריצות מתוזמנות לא רצות מיום שישי 16:00 עד מוצאי שבת 20:00 שעון ישראל, ורק בשעות הריצה (02, 06, 10, 14, 18, 22).
  # דחיפה והפעלה ידנית אינן נחסמות. הלוח חייב להתאים ל-`src/lib/runSchedule.ts`.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shabbat: ${{ steps.t.outputs.skip }}
    steps:
      - id: t
        run: |
          dow=$(TZ=Asia/Jerusalem date +%u); hour=$((10#$(TZ=Asia/Jerusalem date +%H))); hhmm=$(TZ=Asia/Jerusalem date +%H%M)
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ $((hour % 4)) -ne 2 ]; then skip=true; echo "לא שעת ריצה — מדלגים"; fi
            if { [ "$dow" = 5 ] && [ "$((10#$hhmm))" -ge 1600 ]; } || { [ "$dow" = 6 ] && [ "$((10#$hhmm))" -lt 2000 ]; }; then skip=true; echo "שבת — מדלגים"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.shabbat != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: סקרים חדשים מוויקיפדיה — נכנסים אוטומטית, בלי אימות ובלי המתנה
        run: |
          set -uo pipefail
          T="Opinion_polling_for_the_2026_Israeli_legislative_election"
          if curl --fail --silent --show-error --retry 3 --max-time 60 -A "elections26-poll-aggregator (https://github.com/hopetohelp/26)" "https://en.wikipedia.org/w/index.php?title=${T}&action=raw" -o /tmp/polls.wiki \
             && [ "$(wc -c < /tmp/polls.wiki)" -gt 100000 ] && grep -q '^{|' /tmp/polls.wiki; then
            cp /tmp/polls.wiki "raw/wikipedia/en__${T}.wiki"
            echo "טבלת הסקרים עודכנה מוויקיפדיה"
          else
            echo "::warning::הורדת ויקיפדיה נכשלה או חלקית — נשארת הגרסה שבריפו"
          fi
      - name: בניית הנתונים לרגע הפרסום
        run: python3 pipeline/build_data.py
      - run: npm test
        env:
          AUTO_INGEST: "1"
      - run: npm run build
        env:
          # כפתור "הערה?" — השרת הקטן ב-worker/feedback (Cloudflare). בלי המשתנה הכפתור אינו מוצג.
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
          # שרת ה-MCP (worker/mcp): מסך "חיבור עוזר AI", מגירת "עוזרי AI", ושתי הכתובות ב-llms.txt וב-data/index.json
          VITE_MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
          MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
      - name: עותק הסטטיסטיקות בתוך האתר — מוצג לכולם גם בלי חיבור לשרת ההשתתפות
        run: |
          set -uo pipefail
          valid() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (typeof d.participants !== "number") process.exit(1)' "$1"; }
          if curl --fail --silent --show-error --retry 3 --max-time 30 https://elections26-crowd.hopetohelp-il.workers.dev/dashboard -o /tmp/dashboard.json && valid /tmp/dashboard.json; then
            echo "עותק חדש מהשרת"
          elif curl --fail --silent --show-error --retry 2 --max-time 30 https://26.hopetohelp.net/dashboard.json -o /tmp/dashboard.json && valid /tmp/dashboard.json; then
            echo "::warning::השרת לא ענה — נשאר העותק הקודם שבאתר"
          else
            echo "::warning::אין עותק סטטיסטיקות — המסך ינסה את השרת בלבד"
            exit 0
          fi
          cp /tmp/dashboard.json dist/dashboard.json
      - name: עותק ציבורי של מוני המשתמשים והכניסות
        run: |
          mkdir -p dist/data
          if curl --fail --silent --show-error --retry 2 --max-time 15 https://elections26-feedback.hopetohelp-il.workers.dev/usage -o /tmp/usage.json && node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/usage.json","utf8")); if(!Number.isSafeInteger(d.totalUsers)||d.totalUsers<0||!Number.isSafeInteger(d.totalVisitors)||d.totalVisitors<0||!Number.isFinite(Date.parse(d.publishedAt)))process.exit(1)'; then
            cp /tmp/usage.json dist/data/usage.json
          else
            echo "::warning::מוני השימוש לא זמינים לפרסום; הבית ינסה את המקור החי, ללא הצגת אפס מדומה"
          fi
      - name: הנתונים הפתוחים — dashboard.json נעטף ב-about, וכל קובץ שבאינדקס קיים ועדכני
        run: |
          set -euo pipefail
          npx vite-node scripts/open-data.ts --dashboard
          if [ -f dist/dashboard.json ]; then npx vite-node scripts/check-open-data.ts --with-dashboard; else npx vite-node scripts/check-open-data.ts; fi
      - name: בניית דף מעבר לקישורי GitHub הישנים
        run: node scripts/build-legacy-redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-redirect
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
  deploy:
    needs: deploy-parallel
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: אמת ש-GitHub מציג מעבר לדומיין הפרטי ושקובצי נתונים ישנים זמינים
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "$PAGE_URL" -o /tmp/live.html; then
              grep -q '26.hopetohelp.net' /tmp/live.html
              if grep -q '<div id="root"></div>' /tmp/live.html; then exit 1; fi
              curl --fail --silent --show-error --location "${PAGE_URL}data/index.json" -o /tmp/legacy-data.json
              node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/legacy-data.json","utf8")); if (!Array.isArray(d.files)) process.exit(1)'
              echo "דף המעבר והנתונים הישנים נגישים: $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "דף המעבר ב-GitHub לא עבר בדיקת smoke לאחר הפרסום" >&2
          exit 1
  deploy-parallel:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://26.hopetohelp.net/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: פרסום האתר המלא ל-Cloudflare Pages
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN חסר — הפרסום המקביל לא בוצע" >&2
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist --project-name elections26 --branch main
      - name: בדיקת האתר המלא בדומיין הפרטי
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 https://26.hopetohelp.net/ -o /tmp/parallel.html \
              && grep -q '<div id="root"></div>' /tmp/parallel.html; then
              echo "האתר המלא בדומיין הפרטי נגיש"
              exit 0
            fi
            sleep 10
          done
          echo "האתר בדומיין הפרטי לא עבר בדיקת smoke" >&2
          exit 1
