# תהליך זמני — שלב אחרון: מחיקת פריסות התצוגה המקדימה preview-pr-728 ב-Cloudflare (CLAUDE.md, שלב 6); יוסר מיד אחר כך
name: preview-pr-728
on:
  push:
    branches: [claude/data-ballots]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - name: מחיקת פריסות preview-pr-728
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/elections26/deployments"
          ids=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?env=preview&per_page=25" | jq -r '.result[] | select(.deployment_trigger.metadata.branch=="preview-pr-728") | .id')
          echo "פריסות למחיקה: $(echo $ids | wc -w)"
          for id in $ids; do
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id?force=true" | jq -c '{id: "'$id'", success}'
          done
          left=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?env=preview&per_page=25" | jq '[.result[] | select(.deployment_trigger.metadata.branch=="preview-pr-728")] | length')
          echo "נותרו: $left"; test "$left" = 0
