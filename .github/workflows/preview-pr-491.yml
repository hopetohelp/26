name: מחיקת התצוגה המקדימה הזמנית — PR 491 בלבד

on:
  push:
    branches: [claude/video-music-creation-site-jks6cu]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מחיקת פריסות preview-pr-491 בלבד מ-Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: a64716cf8cec4b4885a5eb06e9a3ee9a
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/elections26/deployments"
          ids=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?env=preview&per_page=25" \
            | jq -r '.result[] | select(.deployment_trigger.metadata.branch == "preview-pr-491") | .id')
          [ -z "$ids" ] && { echo "אין פריסות למחיקה"; exit 0; }
          for id in $ids; do
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$id?force=true" | jq -c '{success}'
            echo "נמחקה פריסה $id"
          done
