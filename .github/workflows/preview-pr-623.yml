name: תצוגה מקדימה PR 623 (זמני)
on:
  push:
    branches: [feat/flow-graph-more]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a64716cf8cec4b4885a5eb06e9a3ee9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python3 pipeline/build_data.py
      - run: npm run build
        env:
          VITE_FEEDBACK_URL: https://elections26-feedback.hopetohelp-il.workers.dev
          VITE_CROWD_URL: https://elections26-crowd.hopetohelp-il.workers.dev
          VITE_MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
          MCP_URL: https://elections26-mcp.hopetohelp-il.workers.dev
      - run: test -f dist/index.html
      - name: פרסום לענף תצוגה
        run: npx --yes wrangler@4 pages deploy dist --project-name elections26 --branch preview-pr-623
